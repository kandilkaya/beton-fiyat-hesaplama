<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beton Fiyat Hesaplama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; margin-bottom: 20px; color: #1e3a8a; font-size: 22px; font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: 600; color: #475569; font-size: 14px; }
        select, input[type="number"] { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; background-color: #fff; outline: none; transition: border-color 0.2s; }
        select { -webkit-appearance: none; appearance: none; }
        select:focus, input[type="number"]:focus { border-color: #3b82f6; }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: '▼'; font-size: 12px; color: #64748b; position: absolute; right: 15px; top: 15px; pointer-events: none; }
        .row { display: flex; gap: 10px; }
        .row .col { flex: 1; }
        .result-box { margin-top: 25px; background: linear-gradient(135deg, #1e3a8a, #3b82f6); padding: 20px; border-radius: 10px; color: white; text-align: center; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        .result-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; margin-bottom: 5px; }
        .price { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .sub-info { font-size: 13px; opacity: 0.85; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h2>Beton Fiyat Otomasyonu</h2>
    
    <label for="betonSecimi">Beton Sınıfı Seçin:</label>
    <div class="select-wrapper">
        <select id="betonSecimi" onchange="hesapla()">
            <option value="">-- Seçiniz --</option>
        </select>
    </div>

    <label for="mesafeSecimi">Mesafe Aralığı Seçin:</label>
    <div class="select-wrapper">
        <select id="mesafeSecimi" onchange="hesapla()">
            <option value="">-- Seçiniz --</option>
        </select>
    </div>

    <div class="row">
        <div class="col">
            <label for="metrekup">Miktar (m³):</label>
            <input type="number" id="metrekup" value="1" min="1" step="any" oninput="hesapla()">
        </div>
        <div class="col">
            <label for="mazotFiyati">Mazot Fiyatı (TL):</label>
            <input type="number" id="mazotFiyati" value="92" min="0" step="any" oninput="hesapla()">
        </div>
    </div>

    <div class="result-box">
        <div class="result-title">Toplam Fiyat (Nakliyeli)</div>
        <div id="toplamFiyat" class="price">0.00 TL</div>
        <div class="sub-info">
            <span>Fabrika m³ Birim Fiyatı:</span>
            <span id="birimFiyat">0.00 TL</span>
        </div>
    </div>
</div>

<script>
// Görseldeki Mazot 92 TL'ye göre hesaplanmış birebir liste değerleri
const veriTabani = {
    "C16/20": { birim: 2022, fiyatlar: [2795.4, 2884.4, 2973.4, 3062.4, 3151.4, 3231.2, 3320.2, 3409.2, 3498.2, 3587.2, 3736, 4056.4] },
    "C16/20 BRÜT": { birim: 2100, fiyatlar: [2873.4, 2962.4, 3051.4, 3140.4, 3229.4, 3309.2, 3398.2, 3487.2, 3576.2, 3665.2, 3814, 4134.4] },
    "C 20/25": { birim: 2346, fiyatlar: [3119.4, 3208.4, 3297.4, 3386.4, 3475.4, 3555.2, 3644.2, 3733.2, 3822.2, 3911.2, 4060, 4380.4] },
    "C20/25 BRÜT": { birim: 2388, fiyatlar: [3161.4, 3250.4, 3339.4, 3428.4, 3517.4, 3597.2, 3686.2, 3775.2, 3864.2, 3953.2, 4102, 4422.4] },
    "C25/30": { birim: 2412, fiyatlar: [3185.4, 3274.4, 3363.4, 3452.4, 3541.4, 3621.2, 3710.2, 3799.2, 3888.2, 3977.2, 4126, 4446.4] },
    "C25/30 BRÜT": { birim: 2508, fiyatlar: [3281.4, 3370.4, 3459.4, 3548.4, 3637.4, 3717.2, 3806.2, 3895.2, 3984.2, 4073.2, 4222, 4542.4] },
    "C30/37": { birim: 2580, fiyatlar: [3353.4, 3442.4, 3531.4, 3620.4, 3709.4, 3789.2, 3878.2, 3967.2, 4056.2, 4145.2, 4294, 4614.4] },
    "C30/37 BRÜT": { birim: 2634, fiyatlar: [3407.4, 3496.4, 3585.4, 3674.4, 3763.4, 3843.2, 3932.2, 4021.2, 4110.2, 4199.2, 4348, 4668.4] },
    "C35/45": { birim: 2796, fiyatlar: [3569.4, 3658.4, 3747.4, 3836.4, 3925.4, 4005.2, 4094.2, 4183.2, 4272.2, 4361.2, 4510, 4830.4] },
    "C35/45 BRÜT": { birim: 2892, fiyatlar: [3665.4, 3754.4, 3843.4, 3932.4, 4021.4, 4101.2, 4190.2, 4279.2, 4368.2, 4457.2, 4606, 4926.4] },
    "C40/50": { birim: 3024, fiyatlar: [3797.4, 3886.4, 3975.4, 4064.4, 4153.4, 4233.2, 4322.2, 4411.2, 4500.2, 4589.2, 4738, 5058.4] },
    "C40/50 BRÜT": { birim: 3102, fiyatlar: [3875.4, 3964.4, 4053.4, 4142.4, 4231.4, 4311.2, 4400.2, 4489.2, 4578.2, 4667.2, 4816, 5136.4] },
    "C20 SAHA": { birim: 2334, fiyatlar: [3107.4, 3196.4, 3285.4, 3374.4, 3463.4, 3543.2, 3632.2, 3721.2, 3810.2, 3899.2, 4048, 4368.4] },
    "C25 SAHA": { birim: 2454, fiyatlar: [3227.4, 3316.4, 3405.4, 3494.4, 3583.4, 3663.2, 3752.2, 3841.2, 3930.2, 4019.2, 4168, 4488.4] },
    "C30 SAHA": { birim: 2586, fiyatlar: [3359.4, 3448.4, 3537.4, 3626.4, 3715.4, 3795.2, 3884.2, 3973.2, 4062.2, 4151.2, 4300, 4620.4] },
    "GRO 2": { birim: 1842, fiyatlar: [2615.4, 2704.4, 2793.4, 2882.4, 2971.4, 3051.2, 3140.2, 3229.2, 3318.2, 3407.2, 3556, 3876.4] }
};

const mesafeler = [
    "0-5 KM (1.ZON)", "5-10 KM (2.ZON)", "10-15 KM (3.ZON)", "15-20 KM (4.ZON)", "20-25 KM (5.ZON)", 
    "25-30 KM (6.ZON)", "30-35 KM (7.ZON)", "35-40 KM (8.ZON)", "40-45 KM (9.ZON)", "45-50 KM (10.ZON)", 
    "50-55 KM (11.ZON)", "55-60 KM (12.ZON)"
];

// Zonların kademeli km çarpan artış oranları
const mesafeKatsayilari = [0, 1, 2, 3, 4, 4.9, 5.9, 6.9, 7.9, 8.9, 10.55, 14.375];

const betonSelect = document.getElementById("betonSecimi");
const mesafeSelect = document.getElementById("mesafeSecimi");
const m3Input = document.getElementById("metrekup");
const mazotInput = document.getElementById("mazotFiyati");

Object.keys(veriTabani).forEach(beton => {
    let opt = document.createElement("option");
    opt.value = beton;
    opt.textContent = beton;
    betonSelect.appendChild(opt);
});

mesafeler.forEach((mesafe, index) => {
    let opt = document.createElement("option");
    opt.value = index;
    opt.textContent = mesafe;
    mesafeSelect.appendChild(opt);
});

function hesapla() {
    const secilenBeton = betonSelect.value;
    const secilenMesafeEndeksi = mesafeSelect.value;
    let m3Miktari = parseFloat(m3Input.value);
    let guncelMazot = parseFloat(mazotInput.value);

    if (isNaN(m3Miktari) || m3Miktari <= 0) m3Miktari = 1;
    if (isNaN(guncelMazot) || guncelMazot < 0) guncelMazot = 92; // Boş bırakılırsa baz fiyat (92) geçerli olur

    if (secilenBeton === "" || secilenMesafeEndeksi === "") {
        document.getElementById("toplamFiyat").textContent = "0.00 TL";
        document.getElementById("birimFiyat").textContent = "0.00 TL";
        return;
    }

    const betonVerisi = veriTabani[secilenBeton];
    const birimFiyat = betonVerisi.birim;
    
    // Tablodaki baz fiyat (Mazot 92 TL iken)
    const bazFiyat = betonVerisi.fiyatlar[secilenMesafeEndeksi];
    
    // Mazot 92'den farklıysa aradaki farkı katsayıya göre hesaplayıp ekle/çıkar yapıyoruz
    const mazotFarki = (guncelMazot - 92) * mesafeKatsayilari[secilenMesafeEndeksi];
    const nihaiBirimFiyat = bazFiyat + mazotFarki;
    
    const toplamFiyat = nihaiBirimFiyat * m3Miktari;

    document.getElementById("birimFiyat").textContent = birimFiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
    document.getElementById("toplamFiyat").textContent = toplamFiyat.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
}
</script>

</body>
</html>
