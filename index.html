<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beton Fiyat Hesaplama</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin: 0 0 30px;
            font-size: 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        select,
        input {
            width: 100%;
            padding: 14px 14px 14px 43px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 15px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
        }

        .result-container {
            margin-top: 28px;
            padding: 22px;
            text-align: center;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border: 1px solid #bbf7d0;
            border-radius: 14px;
        }

        .unit-price {
            display: inline-block;
            padding: 5px 13px;
            margin-bottom: 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.65);
            color: #166534;
            font-size: 14px;
            font-weight: 600;
        }

        .total-label {
            margin-bottom: 5px;
            color: #374151;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .price-text {
            color: #15803d;
            font-size: 32px;
            font-weight: 800;
        }

        .info {
            margin-top: 15px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="calculator-card">
        <h2>Beton Maliyet Hesaplama</h2>

        <div class="form-group">
            <label for="betonSinifi">Beton Sınıfı</label>

            <div class="input-wrapper">
                <span class="input-icon">🧱</span>

                <select id="betonSinifi" onchange="hesapla()">
                    <option value="C16/20">C16/20</option>
                    <option value="C16/20 BRÜT">C16/20 BRÜT</option>
                    <option value="C 20/25">C 20/25</option>
                    <option value="C20/25 BRÜT">C20/25 BRÜT</option>
                    <option value="C25/30">C25/30</option>
                    <option value="C25/30 BRÜT">C25/30 BRÜT</option>
                    <option value="C30/37">C30/37</option>
                    <option value="C30/37 BRÜT">C30/37 BRÜT</option>
                    <option value="C35/45">C35/45</option>
                    <option value="C35/45 BRÜT">C35/45 BRÜT</option>
                    <option value="C40/50">C40/50</option>
                    <option value="C40/50 BRÜT">C40/50 BRÜT</option>
                    <option value="C20 SAHA">C20 SAHA</option>
                    <option value="C25 SAHA">C25 SAHA</option>
                    <option value="C30 SAHA">C30 SAHA</option>
                    <option value="GRO 2">GRO 2</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="mesafe">Mesafe / Bölge</label>

            <div class="input-wrapper">
                <span class="input-icon">📍</span>

                <select id="mesafe" onchange="hesapla()">
                    <option value="0">1. ZON (0-5 KM)</option>
                    <option value="1">2. ZON (5-10 KM)</option>
                    <option value="2">3. ZON (10-15 KM)</option>
                    <option value="3">4. ZON (15-20 KM)</option>
                    <option value="4">5. ZON (20-25 KM)</option>
                    <option value="5">6. ZON (25-30 KM)</option>
                    <option value="6">7. ZON (30-35 KM)</option>
                    <option value="7">8. ZON (35-40 KM)</option>
                    <option value="8">9. ZON (40-45 KM)</option>
                    <option value="9">10. ZON (45-50 KM)</option>
                    <option value="10">11. ZON (50-55 KM)</option>
                    <option value="11">12. ZON (55-60 KM)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="miktar">Miktar (m³)</label>

            <div class="input-wrapper">
                <span class="input-icon">📊</span>

                <input
                    type="number"
                    id="miktar"
                    value="1"
                    min="0"
                    step="0.5"
                    oninput="hesapla()"
                >
            </div>
        </div>

        <div class="result-container">
            <div class="unit-price" id="birimFiyatGosterim">
                1 m³ Fiyatı: -- TL
            </div>

            <div class="total-label">
                Toplam Ödenecek Tutar
            </div>

            <div class="price-text" id="toplamFiyat">
                -- TL
            </div>
        </div>

        <div class="info">
            Fiyatlar Excel tablosundaki değerler esas alınarak hesaplanır.
        </div>
    </div>

    <script>
        /*
         * Excel/görsel tablosundaki fiyatlar.
         *
         * Her satırdaki değerler sırasıyla:
         *
         * [Birim Fiyatı,
         *  1. Zon,
         *  2. Zon,
         *  ...
         *  12. Zon]
         */

        const fiyatTablosu = {
            "C16/20": [
                2122, 2914, 3013, 3111.75, 3210.5, 3309.25,
                3397.5, 3496.25, 3595, 3693.75, 3792.5,
                3959.5, 4295.5
            ],

            "C16/20 BRÜT": [
                2200, 2992, 3091, 3189.75, 3288.5, 3387.25,
                3475.5, 3574.25, 3673, 3771.75, 3870.5,
                4037.5, 4373.5
            ],

            "C 20/25": [
                2446, 3238, 3337, 3435.75, 3534.5, 3633.25,
                3721.5, 3820.25, 3919, 4017.75, 4116.5,
                4283.5, 4619.5
            ],

            "C20/25 BRÜT": [
                2488, 3280, 3379, 3477.75, 3576.5, 3675.25,
                3763.5, 3862.25, 3961, 4059.75, 4158.5,
                4325.5, 4661.5
            ],

            "C25/30": [
                2512, 3304, 3403, 3501.75, 3600.5, 3699.25,
                3787.5, 3886.25, 3985, 4083.75, 4182.5,
                4349.5, 4685.5
            ],

            "C25/30 BRÜT": [
                2608, 3400, 3499, 3597.75, 3696.5, 3795.25,
                3883.5, 3982.25, 4081, 4179.75, 4278.5,
                4445.5, 4781.5
            ],

            "C30/37": [
                2680, 3472, 3571, 3669.75, 3768.5, 3867.25,
                3955.5, 4054.25, 4153, 4251.75, 4350.5,
                4517.5, 4853.5
            ],

            "C30/37 BRÜT": [
                2734, 3526, 3625, 3723.75, 3822.5, 3921.25,
                4009.5, 4108.25, 4207, 4305.75, 4404.5,
                4571.5, 4907.5
            ],

            "C35/45": [
                2896, 3688, 3787, 3885.75, 3984.5, 4083.25,
                4171.5, 4270.25, 4369, 4467.75, 4566.5,
                4733.5, 5069.5
            ],

            "C35/45 BRÜT": [
                2992, 3784, 3883, 3981.75, 4080.5, 4179.25,
                4267.5, 4366.25, 4465, 4563.75, 4662.5,
                4829.5, 5165.5
            ],

            "C40/50": [
                3124, 3916, 4013, 4111.75, 4212.5, 4311.25,
                4399.5, 4498.25, 4597, 4695.75, 4794.5,
                4961.5, 5297.5
            ],

            "C40/50 BRÜT": [
                3202, 3994, 4093, 4191.75, 4290.5, 4389.25,
                4477.5, 4576.25, 4675, 4773.75, 4872.5,
                5039.5, 5375.5
            ],

            "C20 SAHA": [
                2434, 3226, 3325, 3423.75, 3522.5, 3621.25,
                3709.5, 3808.25, 3907, 4005.75, 4104.5,
                4271.5, 4607.5
            ],

            "C25 SAHA": [
                2554, 3346, 3445, 3543.75, 3642.5, 3741.25,
                3829.5, 3928.25, 4027, 4125.75, 4224.5,
                4391.5, 4727.5
            ],

            "C30 SAHA": [
                2686, 3478, 3577, 3675.75, 3774.5, 3873.25,
                3961.5, 4060.25, 4159, 4257.75, 4356.5,
                4523.5, 4859.5
            ],

            "GRO 2": [
                2042, 2834, 2933, 3031.75, 3130.5, 3229.25,
                3317.5, 3416.25, 3515, 3613.75, 3712.5,
                3879.5, 4215.5
            ]
        };

        function formatla(sayi) {
            return sayi.toLocaleString("tr-TR", {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        function hesapla() {
            const betonSinifi =
                document.getElementById("betonSinifi").value;

            const zon =
                parseInt(document.getElementById("mesafe").value, 10);

            let miktar =
                parseFloat(document.getElementById("miktar").value);

            if (isNaN(miktar) || miktar < 0) {
                miktar = 0;
            }

            /*
             * Dizinin 0. elemanı birim fiyatıdır.
             * Zon fiyatları 1. elemandan başladığı için zon + 1 kullanılır.
             */
            const birimFiyat =
                fiyatTablosu[betonSinifi][zon + 1];

            const toplamTutar =
                birimFiyat * miktar;

            document.getElementById("birimFiyatGosterim").textContent =
                `1 m³ Fiyatı: ${formatla(birimFiyat)} TL`;

            document.getElementById("toplamFiyat").textContent =
                `${formatla(toplamTutar)} TL`;
        }

        window.addEventListener("load", hesapla);
    </script>

</body>
</html>
