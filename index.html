<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beton Fiyat Otomasyonu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            border: 1px solid #eef2f5;
        }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4b5563;
            font-size: 14px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            color: #334155;
            box-sizing: border-box;
            background-color: #ffffff;
            transition: all 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-hesapla {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-hesapla:hover {
            background-color: #1d4ed8;
        }
        .result-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 12px;
            padding: 20px;
            color: #ffffff;
            margin-top: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2);
        }
        .result-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        .result-price {
            font-size: 32px;
            font-weight: 800;
            color: #38bdf8;
        }
        .info-text {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Beton Fiyat Otomasyonu</h2>
    
    <div class="form-group">
        <label for="betonSinifi">Beton Sınıfı</label>
        <select id="betonSinifi">
            <option value="2300">C20 / m³ (2.300 TL)</option>
            <option value="2450">C25 / m³ (2.450 TL)</option>
            <option value="2600" selected>C30 / m³ (2.600 TL)</option>
            <option value="2800">C35 / m³ (2.800 TL)</option>
            <option value="3100">C40 / m³ (3.100 TL)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="miktar">Miktar (m³)</label>
        <input type="number" id="miktar" value="100" min="1">
    </div>

    <div class="form-group">
        <label for="lojistik">Lojistik / Hizmet Türü</label>
        <select id="lojistik">
            <option value="0">Sadece Mikser (Mesafe Dahil)</option>
            <option value="250">Pompalı Gönderim (+250 TL / m³)</option>
        </select>
    </div>

    <button class="btn-hesapla" onclick="hesapla()">Hesapla</button>

    <div class="result-box">
        <div class="result-title">Tahmini Toplam Tutar</div>
        <div class="result-price" id="toplamTutar">-- TL</div>
        <div class="info-text">* Fiyatlara yasal KDV oranı dahil edilmemiştir.</div>
    </div>
</div>

<script>
    function hesapla() {
        // Form verilerini alıyoruz
        const birimFiyat = parseFloat(document.getElementById('betonSinifi').value);
        const girilenMiktar = parseFloat(document.getElementById('miktar').value) || 0;
        const lojistikFark = parseFloat(document.getElementById('lojistik').value);

        // Excel eşitlemesi için katsayı (92/100)
        const netMiktar = (girilenMiktar / 100) * 92;

        // Hesaplama formülü
        const toplam = (birimFiyat + lojistikFark) * netMiktar;

        // Para birimini TL formatına çevirme
        document.getElementById('toplamTutar').innerText = toplam.toLocaleString('tr-TR', {
            style: 'currency',
            currency: 'TRY'
        });
    }
</script>

</body>
</html>
